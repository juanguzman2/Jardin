name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Tests de dominio
        run: npm test -- --ci
      - name: Bundle de Android (Hermes)
        run: npx expo export --platform android --output-dir dist-android
